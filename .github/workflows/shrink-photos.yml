name: Shrink big photos

# When photos are uploaded (for example from a phone with Pages CMS), this resizes anything
# larger than 1600 px so the site stays fast. It only touches images that are too big, so it never loops.
on:
  push:
    paths:
      - 'images/**'

permissions:
  contents: write

jobs:
  shrink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resize oversized JPG/PNG files
        run: |
          changed=0
          while IFS= read -r -d '' f; do
            dims=$(identify -format '%w %h' "$f[0]" 2>/dev/null || echo "0 0")
            set -- $dims
            if [ "$1" -gt 1600 ] || [ "$2" -gt 1600 ]; then
              mogrify -auto-orient -resize '1600x1600>' -quality 85 "$f"
              changed=1
            fi
          done < <(find images -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -print0)
          echo "changed=$changed" >> "$GITHUB_ENV"
      - name: Commit resized photos
        if: env.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images
          git commit -m "Shrink large photos"
          git push
